name: rlportfolio
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.12

  # Core scientific computing
  - numpy>=2.2.6
  - pandas>=2.2.2
  - scipy>=1.10.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Configuration
  - pyyaml>=6.0

  # Utilities
  - tqdm>=4.65.0
  - python-dateutil>=2.8.0

  # Jupyter
  - jupyter>=1.0.0
  - ipykernel>=6.25.0

  # Development & Testing
  - pytest>=7.4.0

  # RL Framework (better via pip for latest versions)
  - stable-baselines3>=2.7.0
  - gymnasium>=1.0.0

  # Pip-only dependencies (not available or better via pip)
  - pip
  - pip:
    # Technical Analysis (pip-only)
    - pandas-ta>=0.4.71b0

    # Market data (shared SQLite-backed client)
    - finbase

variables:
  # pandas-ta 0.4.71b0 imports numba-jitted helpers with cache=True; on some
  # macOS/conda installs numba cannot locate those package files for caching
  # during import. Disabling JIT keeps imports and tests reproducible.
  NUMBA_DISABLE_JIT: "1"
