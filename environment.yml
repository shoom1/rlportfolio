name: rlportfolio
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.12

  # Core scientific computing
  - numpy>=1.26,<2.0.0
  - pandas>=2.2.2
  - scipy>=1.10.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Configuration
  - pyyaml>=6.0

  # Utilities
  - tqdm>=4.65.0
  - python-dateutil>=2.8.0

  # Jupyter
  - jupyter>=1.0.0
  - ipykernel>=6.25.0

  # Development & Testing
  - pytest>=7.4.0

  # RL Framework (better via pip for latest versions)
  - stable-baselines3>=2.7.0
  - gymnasium>=1.0.0

  # Pip-only dependencies (not available or better via pip)
  - pip
  - pip:
    # Technical Analysis (pip-only)
    - pandas-ta>=0.4.25b

    # Data Sources
    - yfinance>=0.2.36
    - polygon-api-client>=1.12.5
