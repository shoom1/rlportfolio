# Option B: PPO vs SAC vs A2C — A2C arm.
# Shares data/environment/training with opt_b_ppo.yaml.

data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
  train_days: 1460
  val_days: 365

environment:
  initial_balance: 10000.0
  transaction_cost: 0.001
  window_size: 20
  reward_function: sharpe
  reward_params:
    window: 30
    risk_free_rate: 0.02

agent:
  algorithm: A2C
  policy: MlpPolicy
  learning_rate: 0.0007
  n_steps: 5
  gamma: 0.99
  gae_lambda: 1.0
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: false
  policy_kwargs:
    net_arch: [256, 256]

training:
  total_timesteps: 50000
  eval_freq: 5000
  save_freq: 10000
  log_dir: logs/opt_b_a2c
  model_dir: training/models/opt_b_a2c
