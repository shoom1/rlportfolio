# Step 1: div19 PPO retrained with 200k timesteps to probe whether the
# 50k runs were undertrained. Same hyperparams as opt_c_div19 otherwise.

data:
  tickers:
    - AAPL
    - MSFT
    - NVDA
    - JPM
    - BAC
    - JNJ
    - UNH
    - XOM
    - CVX
    - PG
    - KO
    - WMT
    - CAT
    - HON
    - LIN
    - DIS
    - VZ
    - NEE
    - SPG
  train_days: 1460
  val_days: 365

environment:
  initial_balance: 10000.0
  transaction_cost: 0.001
  window_size: 20
  reward_function: sharpe
  reward_params:
    window: 30
    risk_free_rate: 0.02

agent:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]

training:
  total_timesteps: 200000
  eval_freq: 10000
  save_freq: 25000
  log_dir: logs/opt_c_div19_long
  model_dir: training/models/opt_c_div19_long
