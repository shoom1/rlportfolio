# Option B: PPO vs SAC vs A2C comparison — PPO arm.
# All three arms share identical data/environment/training settings;
# only the `agent:` section varies.

data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
  train_days: 1460        # ~4 years ending today
  val_days: 365           # last ~1 year

environment:
  initial_balance: 10000.0
  transaction_cost: 0.001
  window_size: 20
  reward_function: sharpe
  reward_params:
    window: 30
    risk_free_rate: 0.02

agent:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]

training:
  total_timesteps: 50000
  eval_freq: 5000
  save_freq: 10000
  log_dir: logs/opt_b_ppo
  model_dir: training/models/opt_b_ppo
