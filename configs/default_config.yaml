# Default configuration for RL Portfolio Optimization

# Data configuration
data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
  train_days: 730        # 2 years of training data
  val_days: 180          # 6 months of validation data
  source: yfinance        # yfinance or polygon

# Environment configuration
environment:
  initial_balance: 10000.0
  transaction_cost: 0.001  # 0.1%
  window_size: 20
  reward_function: sharpe  # simple_return, log_return, sharpe, sortino, risk_adjusted, drawdown_penalized
  reward_params:
    window: 30
    risk_free_rate: 0.02

# Agent configuration
agent:
  algorithm: PPO          # PPO, SAC, A2C
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      - 256
      - 256
      - 128

# Training configuration
training:
  total_timesteps: 100000
  eval_freq: 5000
  save_freq: 10000
  log_dir: logs
  model_dir: training/models
