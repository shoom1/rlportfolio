# Smoke-test config: quickest end-to-end sanity check on finbase data.
# ~20k timesteps -> a few minutes on CPU.

data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
  train_days: 1460        # ~4 years ending today
  val_days: 365           # last ~1 year (overlaps train — acceptable for smoke)

environment:
  initial_balance: 10000.0
  transaction_cost: 0.001
  window_size: 20
  reward_function: sharpe
  reward_params:
    window: 30

agent:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      - 128
      - 128

training:
  total_timesteps: 20000
  eval_freq: 5000
  save_freq: 10000
  log_dir: logs/smoke
  model_dir: training/models/smoke
