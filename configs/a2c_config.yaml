# Configuration for A2C (Advantage Actor-Critic) agent
#
# A2C uses shorter rollouts and simpler updates than PPO (no clipping, single
# gradient step per rollout). This makes it faster per wall-clock step but
# less sample-efficient. Useful as a quick baseline or for rapid iteration.

# Data configuration
data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
  train_days: 730        # 2 years of training data
  val_days: 180          # 6 months of validation data

# Environment configuration
environment:
  initial_balance: 10000.0
  transaction_cost: 0.001
  window_size: 20
  reward_function: sharpe
  reward_params:
    window: 30
    risk_free_rate: 0.02

# Agent configuration (A2C-specific)
agent:
  algorithm: A2C
  policy: MlpPolicy
  learning_rate: 0.0007   # A2C typically uses higher LR than PPO
  n_steps: 5              # Short rollouts (A2C default), updates more frequently
  gamma: 0.99
  gae_lambda: 1.0         # No GAE truncation (full Monte Carlo returns)
  ent_coef: 0.01          # Entropy bonus for exploration
  vf_coef: 0.5            # Value function loss weight
  max_grad_norm: 0.5
  normalize_advantage: false
  policy_kwargs:
    net_arch:
      - 256
      - 256

# Training configuration
training:
  total_timesteps: 150000
  eval_freq: 5000
  save_freq: 15000
  log_dir: logs/a2c
  model_dir: training/models/a2c
