# Option C — Universe comparison: 5 tech stocks vs 19-asset diversified basket.
# Tech5 arm. Identical to opt_b_ppo but written as a fresh config with its own
# model_dir so Option C runs don't clobber Option B's artifacts.

data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
  train_days: 1460
  val_days: 365

environment:
  initial_balance: 10000.0
  transaction_cost: 0.001
  window_size: 20
  reward_function: sharpe
  reward_params:
    window: 30
    risk_free_rate: 0.02

agent:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]

training:
  total_timesteps: 50000
  eval_freq: 5000
  save_freq: 10000
  log_dir: logs/opt_c_tech5
  model_dir: training/models/opt_c_tech5
