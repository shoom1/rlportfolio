[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlportfolio"
version = "0.1.0"
description = "Reinforcement learning portfolio optimization system"
requires-python = ">=3.8"
dependencies = [
    "findata",
    "stable-baselines3[extra]>=2.7.0",
    "gymnasium>=1.0.0",
    "pandas-ta>=0.4.25b",
    "numpy>=1.26,<2.0.0",
    "pandas>=2.2.2",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rich>=10.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16.0", "mlflow>=2.0.0"]
dev = ["pytest>=7.4.0", "jupyter>=1.0.0", "ipykernel>=6.25.0"]

[tool.setuptools.packages.find]
include = ["data*", "environment*", "evaluation*", "experiments*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
